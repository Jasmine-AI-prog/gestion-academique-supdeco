<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Notes')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4"><h1>Notes et évaluations</h1><div class="card p-4 mb-4"><form class="row g-3" method="post" action="/notes/enregistrer"><div class="col-md-5"><label>Inscription</label><select class="form-select" name="inscriptionId" required><option th:each="i:${inscriptions}" th:value="${i.id}" th:text="${i.etudiant.matricule+' — '+i.cours.code}"></option></select></div><div class="col-md-2"><label>Valeur / 20</label><input class="form-control" name="valeur" type="number" min="0" max="20" step="0.01" required></div><div class="col-md-2"><label>Coefficient</label><input class="form-control" name="coefficient" type="number" min="0.1" step="0.1" value="1" required></div><div class="col-md-3"><label>Évaluation</label><input class="form-control" name="evaluation" placeholder="Examen" required></div><div><button class="btn btn-primary">Enregistrer la note</button></div></form></div><div class="card p-3"><table class="table"><thead><tr><th>Étudiant</th><th>Cours</th><th>Évaluation</th><th>Valeur</th><th>Coefficient</th></tr></thead><tbody><tr th:each="n:${notes}"><td th:text="${n.inscription.etudiant.prenom+' '+n.inscription.etudiant.nom}"></td><td th:text="${n.inscription.cours.code}"></td><td th:text="${n.evaluation}"></td><td th:text="${n.valeur+'/20'}"></td><td th:text="${n.coefficient}"></td></tr></tbody></table></div></main></body></html>
