<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Étudiants')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1>Étudiants</h1><a class="btn btn-primary" href="/etudiants/nouveau">+ Ajouter</a></div><div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>Matricule</th><th>Nom complet</th><th>Email</th><th>Filière</th><th></th></tr></thead><tbody><tr th:each="e:${etudiants}"><td th:text="${e.matricule}"></td><td th:text="${e.prenom+' '+e.nom}"></td><td th:text="${e.email}"></td><td th:text="${e.filiere}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/etudiants/{id}/modifier(id=${e.id})}">Modifier</a> <form class="d-inline" method="post" th:action="@{/etudiants/{id}/supprimer(id=${e.id})}"><button class="btn btn-sm btn-outline-danger">Supprimer</button></form></td></tr></tbody></table></div></div></main></body></html>
