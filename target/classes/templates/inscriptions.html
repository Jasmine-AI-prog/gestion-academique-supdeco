<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Inscriptions')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4"><h1>Inscriptions</h1><div class="card p-4 mb-4"><form class="row g-3" method="post" action="/inscriptions/enregistrer"><div class="col-md-5"><label>Étudiant</label><select class="form-select" name="etudiantId" required><option th:each="e:${etudiants}" th:value="${e.id}" th:text="${e.matricule+' — '+e.prenom+' '+e.nom}"></option></select></div><div class="col-md-5"><label>Cours</label><select class="form-select" name="coursId" required><option th:each="c:${cours}" th:value="${c.id}" th:text="${c.code+' — '+c.intitule}"></option></select></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Inscrire</button></div></form></div><div class="card p-3"><table class="table"><thead><tr><th>Étudiant</th><th>Cours</th><th>Date</th><th>Moyenne</th><th></th></tr></thead><tbody><tr th:each="i:${inscriptions}"><td th:text="${i.etudiant.prenom+' '+i.etudiant.nom}"></td><td th:text="${i.cours.code+' — '+i.cours.intitule}"></td><td th:text="${i.dateInscription}"></td><td th:text="${#numbers.formatDecimal(i.moyenne,1,2)+'/20'}"></td><td><form method="post" th:action="@{/inscriptions/{id}/supprimer(id=${i.id})}"><button class="btn btn-sm btn-outline-danger">Supprimer</button></form></td></tr></tbody></table></div></main></body></html>
